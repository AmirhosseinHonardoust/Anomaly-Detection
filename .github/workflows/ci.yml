name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --select E,F,I,B,SIM,UP --line-length 100 .

      - name: Black
        run: black --line-length 100 --check .

      - name: Mypy
        run: mypy --ignore-missing-imports src data

      - name: Pytest
        run: pytest -v
