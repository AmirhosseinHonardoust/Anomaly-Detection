[tool.ruff]
line-length = 100
src = ["src", "data", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.black]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["utils", "detect_anomalies", "generate_transactions", "evaluate"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
