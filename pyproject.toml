[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Multi-detector anomaly detection over synthetic transaction data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.5.2",
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "data", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.black]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["utils", "detect_anomalies", "generate_transactions", "plotting"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
